<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIG BROTHER</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #eef3f8;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      font-weight: 800;
      color: #17457a;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #667085;
      font-size: 15px;
      margin-bottom: 30px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .menu a {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 78px;
      padding: 16px 20px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 20px;
      font-weight: 700;
      color: white;
      background: #17457a;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.12);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .menu a:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.16);
    }

    .menu a:active {
      transform: translateY(0);
    }

    .footer {
      margin-top: 28px;
      font-size: 12px;
      color: #98a2b3;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .logo {
        font-size: 34px;
      }

      .subtitle {
        margin-bottom: 24px;
      }

      .menu a {
        min-height: 70px;
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">BIG BROTHER</div>

    <div class="subtitle">
      Sales & Accounting System
    </div>

    <div class="menu">

      <a href="BIG_BROTHER_INVOICE_GENERATOR_FINAL.html">

      </a>

      <a href="BIG_BROTHER_SALE_RETURN.html">
        🔄&nbsp;&nbsp; Sale Return
      </a>

    </div>

    <div class="footer">
      BIG BROTHER
    </div>

  </div>

</body>
</html>
