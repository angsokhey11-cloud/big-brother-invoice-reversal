<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIG BROTHER — Invoice Reversal Supabase</title>
<style>html,body{margin:0;min-height:100%;background:#eef2f7;font-family:Arial,sans-serif}.bb-loader{min-height:100vh;display:flex;align-items:center;justify-content:center}.bb-card{background:#fff;border:1px solid #d9e2ef;border-radius:14px;padding:22px 28px;box-shadow:0 8px 30px #173a6615;color:#17457a;font-weight:800}.bb-sub{margin-top:6px;color:#6b7280;font-size:12px;font-weight:600}</style>
</head>
<body>
<div class="bb-loader"><div class="bb-card">Loading BIG BROTHER Invoice Reversal…<div class="bb-sub">Supabase Auth · atomic reversal</div></div></div>
<script>
(async function(){
  try{
    const response=await fetch('legacy-google-v1.html?v=20260910-1',{cache:'no-store'});
    if(!response.ok)throw new Error('Could not load Invoice Reversal source.');
    let html=await response.text();

    const adapter='<scr'+'ipt src="supabase-invoice-reversal-adapter.js?v=20260910-1"></scr'+'ipt>';
    const headClose=html.toLowerCase().indexOf('</head>');
    if(headClose<0)throw new Error('Invoice Reversal source is missing </head>.');
    html=html.slice(0,headClose)+adapter+'\n'+html.slice(headClose);

    const patch=`<scr`+`ipt>
(function(){
  const A=window.BBInvoiceReversalAdapter;

  loadRecentSaleReturnInvoices=async function(){
    if(saleReturnInvoiceListLoaded)return;
    const dropdown=document.getElementById('srInvoiceDropdown');
    if(dropdown)dropdown.innerHTML='<div class="bb-sr-invoice-empty">Loading recent invoices...</div>';
    try{
      const data=await A.recent(30);
      recentSaleReturnInvoices=Array.isArray(data?.invoices)?data.invoices.map(v=>String(v||'').trim()).filter(Boolean):[];
      saleReturnInvoiceListLoaded=true;
      renderSaleReturnInvoiceDropdown(document.getElementById('srInvoiceNo')?.value||'');
    }catch(error){
      if(dropdown)dropdown.innerHTML='<div class="bb-sr-invoice-empty">'+escapeHtml(error?.message||'Could not load recent invoices.')+'</div>';
      setSaleReturnStatus(error?.message||'Supabase sign-in or Invoice Reversal access is required.','error');
    }
  };

  loadSaleReturnInvoice=async function(){
    const invoiceNo=String(document.getElementById('srInvoiceNo')?.value||'').trim();
    if(!invoiceNo){alert('Please enter an Invoice No.');return;}
    setSaleReturnStatus('Loading invoice from Supabase...','normal');
    try{
      const data=await A.detail(invoiceNo);
      if(!data?.success)throw new Error(data?.error||'Invoice was not found.');
      saleReturnInvoice=data;
      renderSaleReturnInvoice(data);
      setSaleReturnStatus('Invoice loaded from Supabase. Enter the quantity you want to reverse.','success');
    }catch(error){
      saleReturnInvoice=null;
      hideSaleReturnResults();
      setSaleReturnStatus(error?.message||'Could not load invoice from Supabase.','error');
    }
  };

  saveSaleReturn=async function(){
    if(!saleReturnInvoice){alert('Please load an existing invoice first.');return;}
    const rows=buildSaleReturnRows();
    if(!rows.length){alert('Please enter Reversed Qty for at least one product.');return;}
    const returnDate=document.getElementById('srReturnDate')?.value||'';
    if(!returnDate){alert('Please select the Reversal Date.');return;}
    const reason=document.getElementById('srReason')?.value.trim()||'';
    if(!reason){alert('Please enter a reason for this invoice reversal.');document.getElementById('srReason')?.focus();return;}
    const returnType=document.getElementById('srReturnType')?.value||'Partial Reversal';
    const note=document.getElementById('srNote')?.value.trim()||'';
    const total=calculateSaleReturnTotal();
    if(!confirm('Execute this Invoice Reversal?\n\nInvoice No.: '+saleReturnInvoice.invoice.invoiceNo+'\nProduct lines reversed: '+rows.length+'\nReversal Amount: '+moneyForSaleReturn(total)))return;

    const button=document.getElementById('srSaveBtn');
    if(button){button.disabled=true;button.innerHTML='⏳ Reversing...';}
    try{
      const result=await A.save({
        invoiceNo:saleReturnInvoice.invoice.invoiceNo,
        returnDate,
        returnType,
        reason,
        note,
        lines:rows.map(r=>({lineId:r.lineId,qty:Number(r.qty)||0}))
      });
      if(!result?.success)throw new Error(result?.error||'Invoice Reversal could not be saved.');
      const serverTotal=Number(result.totalAmount);
      const receiptState=buildSaleReturnReceiptState(rows,Number.isFinite(serverTotal)?serverTotal:total);
      document.getElementById('srReceiptContent').innerHTML=buildSaleReturnReceiptHtml(receiptState);
      openSaleReturnReceipt();
      setSaleReturnStatus('Invoice Reversal saved successfully in Supabase. Invoice History will show the reversal.','success');
      saleReturnInvoiceListLoaded=false;
      clearSaleReturn(true);
    }catch(error){
      console.error('Invoice Reversal save failed:',error);
      setSaleReturnStatus(error?.message||'Invoice Reversal could not be saved.','error');
      alert('Could not save the Invoice Reversal.\n\n'+(error?.message||'Please try again.'));
    }finally{
      if(button){button.disabled=false;button.innerHTML='✓ Execute Reversal';}
    }
  };

  document.addEventListener('DOMContentLoaded',async function(){
    const badge=document.querySelector('.sr-badge');
    if(badge)badge.textContent='SUPABASE';
    try{
      await A.ensureSession();
      const profile=await A.accessProfile();
      const name=profile?.staff?.staffName||profile?.user?.email||'Signed in';
      if(badge)badge.title='Supabase · '+name;
    }catch(error){
      setSaleReturnStatus(error?.message||'Please sign in to BIG BROTHER first.','error');
    }
  });
})();
</scr`+`ipt>`;

    const bodyClose=html.toLowerCase().lastIndexOf('</body>');
    if(bodyClose<0)throw new Error('Invoice Reversal source is missing </body>.');
    html=html.slice(0,bodyClose)+patch+'\n'+html.slice(bodyClose);
    html=html.replace('<title>BIG BROTHER — Invoice Reversal</title>','<title>BIG BROTHER — Invoice Reversal Supabase</title>');

    document.open();document.write(html);document.close();
  }catch(error){
    console.error(error);
    document.body.innerHTML='<div class="bb-loader"><div class="bb-card">Could not open Invoice Reversal<div class="bb-sub">'+String(error?.message||error)+'</div></div></div>';
  }
})();
</script>
</body>
</html>
